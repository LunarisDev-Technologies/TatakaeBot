services:
  mongo:
    image: mongo:7-jammy
    container_name: nexus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nexus_network

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: nexus_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/tatakae_nexus
      - MONGODB_URI=mongodb://mongo:27017/tatakae_nexus
      - REDIS_URL=redis://redis:6379
      - API_PORT=4000
    depends_on:
      - mongo
      - redis
    networks:
      - nexus_network

  bot:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.bot
    container_name: nexus_bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/tatakae_nexus
      - MONGODB_URI=mongodb://mongo:27017/tatakae_nexus
      - REDIS_URL=redis://redis:6379
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    depends_on:
      - mongo
      - redis
    networks:
      - nexus_network

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: nexus_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/tatakae_nexus
      - MONGODB_URI=mongodb://mongo:27017/tatakae_nexus
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - nexus_network

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: nexus_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:4000
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - api
    networks:
      - nexus_network

volumes:
  mongo_data:
  redis_data:

networks:
  nexus_network:
    driver: bridge

